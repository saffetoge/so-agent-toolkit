<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Rapor</title>
<style>
/* =========================================================================
   KURUMSAL RAPOR ŞABLONU
   Her sayfa bir section.s bloğudur. Üst bar ve alt bilgi sayfanın içinde,
   sayfa numarası CSS sayacıyla kendiliğinden artar.
   Bileşenlerin HTML karşılıkları: parcalar.html
   ========================================================================= */

:root{
  --mur:      #1a1a1a;   /* ana metin */
  --gri:      #7d7d78;   /* ikincil metin, etiketler */
  --gri-ac:   #9d9d97;   /* en soluk metin */
  --vurgu:    #16708f;   /* kurumsal teal: kicker, rakam, toplam */
  --cizgi:    #e9e9e5;   /* ince ayırıcı */
  --cizgi2:   #cfcfc9;   /* kalın ayırıcı */
  --zemin:    #faf9f7;   /* kutu zemini */
  --iyi:      #3f7a52;
  --uyari:    #8a6512;
  --kotu:     #9c3d2e;
  /* veri serisi tonları: koyudan açığa */
  --t1:#16708f; --t2:#4e93a8; --t3:#8bb8c6; --t4:#c3d9df; --t5:#e6eef1;
}

@page{ size:A4; margin:0; }

html{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
*{ box-sizing:border-box; }
body{
  margin:0; background:#fff;
  font:10.5pt/1.62 Charter,"Iowan Old Style",Georgia,"Times New Roman",serif;
  color:var(--mur);
  counter-reset:sayfa;
  -webkit-font-smoothing:antialiased;
}

/* ---- SAYFA ----------------------------------------------------------
   İçerik alanı: 174mm genişlik, 258mm yükseklik.
   Kabaca 40 satır düz metin ya da 3 orta boy bileşen sığar.        */
.s{
  width:210mm; height:297mm; padding:15mm 18mm 13mm;
  display:flex; flex-direction:column;
  break-after:page; counter-increment:sayfa; background:#fff;
}
.s:last-of-type{ break-after:auto; }
.govde{ flex:1 1 auto; min-height:0; }

@media screen{
  body{ background:#e6e6e2; padding:24px 0; }
  .s{ margin:0 auto 24px; box-shadow:0 1px 8px rgba(0,0,0,.18); }
}

/* ---- sayfa üstü / altı ---- */
.ustbar{
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:.6pt solid var(--cizgi2); padding-bottom:6px; margin-bottom:11mm;
  font-size:8pt; letter-spacing:.16em; text-transform:uppercase;
}
.ustbar .marka{ font-weight:700; letter-spacing:.2em; }
.ustbar .sag{ color:var(--gri); }

.altbilgi{
  display:flex; justify-content:space-between;
  border-top:.6pt solid var(--cizgi); padding-top:6px; margin-top:8mm;
  font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase; color:var(--gri-ac);
}
.sayfano::after{ content:counter(sayfa); }

/* ---- KAPAK: section.s.kapak ---- */
.kapak .govde{ display:flex; flex-direction:column; padding-top:42mm; }
.kapak .kunye{ margin-top:auto; }
.kapak h1{ font-size:32pt; margin-bottom:16px; }
.kapak .spot{ font-size:13pt; max-width:130mm; }
.kunye{
  margin-top:26mm; padding-top:12px; border-top:.6pt solid var(--cizgi2);
  display:flex; flex-wrap:wrap; gap:26px 40px; font-size:9pt;
}
.kunye div{ min-width:32mm; }
.kunye .ad{ font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gri); margin-bottom:3px; }

/* ---- başlıklar ---- */
.kicker{
  font-size:8.5pt; letter-spacing:.18em; text-transform:uppercase;
  color:var(--vurgu); font-weight:700; margin:0 0 10px;
}
h1{
  font-size:24pt; line-height:1.15; font-weight:700; letter-spacing:-.015em;
  margin:0 0 12px;
}
.spot{
  font-size:12pt; line-height:1.45; font-style:italic; color:var(--vurgu);
  margin:0 0 18px; max-width:150mm;
}
h2{ font-size:13.5pt; font-weight:700; letter-spacing:-.01em; margin:22px 0 8px; }
h2:first-child{ margin-top:0; }
h3{ font-size:10.5pt; font-weight:700; margin:15px 0 5px; }
h2+p, h3+p{ margin-top:0; }

p{ margin:0 0 9px; text-align:justify; hyphens:auto; }
ul,ol{ margin:0 0 10px; padding-left:18px; }
li{ margin-bottom:4px; }
b,strong{ font-weight:700; }
a{ color:var(--vurgu); text-decoration:none; }

.dipnot{ font-size:8.5pt; line-height:1.5; color:var(--gri); text-align:justify;
  margin:8px 0 14px; }
.ayrac{ border:0; border-top:.6pt solid var(--cizgi); margin:18px 0; }
.ikili{ display:flex; gap:20px; margin:12px 0; }
.ikili > *{ flex:1 1 0; min-width:0; }

/* ---- içindekiler ---- */
.icindekiler{ list-style:none; margin:14px 0; padding:0; }
.icindekiler li{ display:flex; align-items:baseline; gap:6px; margin-bottom:9px; }
.icindekiler .ad{ flex:0 0 auto; }
.icindekiler .nokta{ flex:1 1 auto; border-bottom:.6pt dotted var(--cizgi2);
  transform:translateY(-3px); }
.icindekiler .no{ flex:0 0 auto; color:var(--gri); font-variant-numeric:tabular-nums; }

/* =========================================================================
   TABLO
   ========================================================================= */
table{ width:100%; border-collapse:collapse; margin:10px 0 14px; font-size:10pt; }
table.kucuk{ font-size:9pt; }
th{
  text-align:left; font-size:8pt; font-weight:400; letter-spacing:.14em;
  text-transform:uppercase; color:var(--gri);
  padding:0 10px 7px 0; border-bottom:.6pt solid var(--cizgi2); vertical-align:bottom;
}
td{ padding:9px 10px 9px 0; border-bottom:.6pt solid var(--cizgi); vertical-align:top; }
tr:last-child td{ border-bottom:0; }
th.sayi, td.sayi{ text-align:right; padding-right:0; white-space:nowrap;
  font-variant-numeric:tabular-nums; }
th.orta, td.orta{ text-align:center; }
td .alt{ display:block; font-size:8.5pt; color:var(--gri); line-height:1.4; margin-top:2px; }
tr.toplam td{
  border-top:1.2pt solid var(--cizgi2); border-bottom:0;
  font-weight:700; color:var(--vurgu); padding-top:10px;
}
tr.vurgu td{ background:var(--zemin); }

/* =========================================================================
   KPI ŞERİDİ
   ========================================================================= */
.kpi-serit{
  display:flex; gap:22px; margin:16px 0 24px; padding-top:14px;
  border-top:.6pt solid var(--cizgi2);
}
.kpi{ flex:1 1 0; }
.kpi-sayi{
  font-size:23pt; line-height:1.05; font-weight:700; color:var(--vurgu);
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.kpi-sayi small{ font-size:12pt; font-weight:400; }
.kpi-ad{
  font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gri); margin-top:5px; line-height:1.45;
}

/* =========================================================================
   DERECE DAİRELERİ (harvey ball)
   ========================================================================= */
.derece{ display:inline-flex; gap:4px; align-items:center; }
.derece i{
  width:7.5px; height:7.5px; border-radius:50%;
  border:.8pt solid var(--mur); display:inline-block;
}
.derece i.d{ background:var(--mur); }
.derece.acik i{ border-color:var(--vurgu); }
.derece.acik i.d{ background:var(--vurgu); }

/* =========================================================================
   YATAY BAR
   ========================================================================= */
.barlar{ margin:12px 0 16px; }
.bar-sat{ display:flex; align-items:center; gap:12px; margin-bottom:8px; font-size:9.5pt; }
.bar-ad{ flex:0 0 42mm; }
.bar-yol{ flex:1 1 auto; height:9px; background:var(--cizgi); }
.bar-dolu{ height:100%; background:var(--vurgu); }
.bar-dolu.ikinci{ background:var(--t3); }
.bar-deger{ flex:0 0 20mm; text-align:right; color:var(--gri);
  font-variant-numeric:tabular-nums; }

/* =========================================================================
   PAY ŞERİDİ (yığılmış oran)
   ========================================================================= */
.pay{ display:flex; height:22px; margin:12px 0 8px; }
.pay div{
  display:flex; align-items:center; justify-content:center;
  font-size:8pt; color:#fff; font-variant-numeric:tabular-nums; overflow:hidden;
}
.pay div.koyu-yazi{ color:var(--mur); }   /* t3 ve daha açık tonlarda şart */
.lejant{ display:flex; flex-wrap:wrap; gap:16px; font-size:8.5pt; color:var(--gri);
  margin-bottom:14px; }
.lejant span{ display:inline-flex; align-items:center; gap:6px; }
.lejant i{ width:9px; height:9px; display:inline-block; }

/* =========================================================================
   DONUT
   ========================================================================= */
.donutlar{ display:flex; gap:16mm; margin:14px 0 16px; }
.donut-kutu{ flex:0 0 34mm; text-align:center; }
.donut{ width:28mm; height:28mm; }
.donut circle{ fill:none; stroke-width:4; }
.donut .yol{ stroke:var(--cizgi); }
.donut .dolu{ stroke:var(--vurgu); transform:rotate(-90deg); transform-origin:50% 50%; }
.donut text{ font-size:9px; font-weight:700; fill:var(--mur); text-anchor:middle;
  font-family:inherit; }
.donut-ad{ font-size:8pt; letter-spacing:.12em; text-transform:uppercase;
  color:var(--gri); margin-top:6px; }

/* =========================================================================
   ZAMAN ÇİZELGESİ
   ========================================================================= */
.zaman{ list-style:none; margin:14px 0 18px; padding:0 0 0 20px;
  border-left:.8pt solid var(--cizgi2); }
.zaman li{ position:relative; margin-bottom:14px; }
.zaman li::before{
  content:""; position:absolute; left:-24.5px; top:5px;
  width:9px; height:9px; border-radius:50%;
  background:#fff; border:1.5pt solid var(--vurgu);
}
.zaman li.bitti::before{ background:var(--vurgu); }
.zaman .ne-zaman{ font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase;
  color:var(--vurgu); font-weight:700; }
.zaman .bas{ font-weight:700; margin:2px 0; }
.zaman p{ margin:0; font-size:9.5pt; color:var(--gri); text-align:left; }

/* =========================================================================
   AKIŞ / SÜREÇ ADIMLARI
   ========================================================================= */
.akis{ display:flex; margin:14px 0 18px; }
.akis-adim{ flex:1 1 0; padding:0 14px; border-left:.6pt solid var(--cizgi2); }
.akis-adim:first-child{ padding-left:0; border-left:0; }
.akis-no{ font-size:8pt; letter-spacing:.14em; color:var(--vurgu); font-weight:700;
  margin-bottom:4px; }
.akis-adim .bas{ font-weight:700; font-size:10pt; margin-bottom:3px; }
.akis-adim p{ margin:0; font-size:9pt; color:var(--gri); text-align:left; }

/* =========================================================================
   KUTULAR
   ========================================================================= */
.kutu{
  border:.6pt solid var(--cizgi2); background:var(--zemin);
  padding:12px 15px; margin:12px 0 14px; font-size:9.5pt;
}
.kutu .bas{ font-weight:700; margin-bottom:4px; }
.kutu p{ text-align:left; }
.kutu p:last-child{ margin-bottom:0; }
.kutu.iyi{ border-left:2.5pt solid var(--iyi); }
.kutu.uyari{ border-left:2.5pt solid var(--uyari); }
.kutu.kotu{ border-left:2.5pt solid var(--kotu); }
.kutu.bilgi{ border-left:2.5pt solid var(--vurgu); }

blockquote{
  margin:12px 0 14px; padding:2px 0 2px 16px; border-left:2pt solid var(--vurgu);
  font-style:italic; color:var(--gri);
}
blockquote p{ margin:0; text-align:left; }

.rozet{
  display:inline-block; font-size:7.5pt; letter-spacing:.1em; text-transform:uppercase;
  padding:2px 7px; border:.6pt solid var(--cizgi2); color:var(--gri);
  white-space:nowrap; font-weight:700;
}
.rozet.iyi{ color:var(--iyi); border-color:var(--iyi); }
.rozet.uyari{ color:var(--uyari); border-color:var(--uyari); }
.rozet.kotu{ color:var(--kotu); border-color:var(--kotu); }
.rozet.dolu{ background:var(--vurgu); border-color:var(--vurgu); color:#fff; }

pre{
  background:var(--zemin); border:.6pt solid var(--cizgi); padding:10px 13px;
  font:8.5pt/1.5 ui-monospace,"SF Mono",Menlo,monospace;
  white-space:pre-wrap; word-break:break-word; margin:10px 0 14px;
}
code{ font:9pt ui-monospace,"SF Mono",Menlo,monospace; }
</style>
</head>
<body>

<!-- ================= KAPAK ================= -->
<section class="s kapak">
  <div class="ustbar">
    <span class="marka">MARKA</span>
    <span class="sag">Belge türü</span>
  </div>

  <div class="govde">
    <div class="kicker">Üst etiket · alt başlık</div>
    <h1>Rapor başlığı</h1>
    <p class="spot">Tek cümlelik özet: ne incelendi, sonuç ne çıktı.</p>

    <div class="kunye">
      <div><div class="ad">Tarih</div>GG.AA.YYYY</div>
      <div><div class="ad">Hazırlayan</div>Ad Soyad</div>
      <div><div class="ad">Kapsam</div>Ne incelendi</div>
      <div><div class="ad">Belge no</div>XXX-2026-001</div>
    </div>
  </div>

  <div class="altbilgi">
    <span>Marka · Belge türü</span>
    <span>Sayfa <span class="sayfano"></span></span>
  </div>
</section>

<!-- ================= İÇERİK SAYFASI ================= -->
<section class="s">
  <div class="ustbar">
    <span class="marka">MARKA</span>
    <span class="sag">Belge türü</span>
  </div>

  <div class="govde">
    <h2>Bölüm başlığı</h2>
    <p>Metin.</p>
  </div>

  <div class="altbilgi">
    <span>Marka · Belge türü</span>
    <span>Sayfa <span class="sayfano"></span></span>
  </div>
</section>

</body>
</html>
