<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>AI haber kartı</title>
<style>
  :root {
    --bg: #0a0c11;
    --kart: #12151d;
    --kart-kenar: #232838;
    --metin: #eef1f7;
    --soluk: #9aa3b5;
    --cok-soluk: #66708a;
    --vurgu: {{VURGU}};
    --vurgu-koyu: {{VURGU_KOYU}};
    --mavi: #7aa7ff;
    --mor: #b48cff;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 700px at 85% -5%, rgba(122, 167, 255, .22), transparent 60%),
      radial-gradient(800px 700px at -10% 45%, rgba(180, 140, 255, .14), transparent 60%),
      radial-gradient(700px 600px at 110% 100%, color-mix(in srgb, var(--vurgu) 12%, transparent), transparent 60%),
      var(--bg);
    color: var(--metin);
    font-family: var(--sans);
  }
  .sayfa {
    width: 1080px; height: 1920px;
    padding: {{UST_BOSLUK}}px 68px {{ALT_BOSLUK}}px;
    display: flex; flex-direction: column;
  }
  .icerik { flex: none; display: flex; flex-direction: column; gap: 34px; }
  .icerik > * { flex-shrink: 0; }

  .ust { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .rozet {
    font: 700 22px/1 var(--sans); letter-spacing: .14em;
    color: var(--vurgu-koyu); background: var(--vurgu);
    padding: 12px 18px; border-radius: 999px;
  }
  .ust-bilgi { font: 600 24px/1.2 var(--mono); color: var(--soluk); }

  h1 { font: 800 88px/1.02 var(--sans); letter-spacing: -.035em; }
  h1 .vurgu {
    background: linear-gradient(90deg, var(--mavi), var(--mor) 55%, var(--vurgu));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .alt { font: 400 34px/1.38 var(--sans); color: var(--soluk); margin-top: -12px; }
  .alt b, .kart b { color: var(--metin); font-weight: 600; }
  .alt code { font: 500 30px var(--mono); color: var(--metin); }

  .terminal {
    background: #07080c; border: 1px solid var(--kart-kenar); border-radius: 28px;
    overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
  }
  .terminal-bas {
    display: flex; align-items: center; gap: 12px; padding: 20px 28px;
    background: #161a24; border-bottom: 1px solid var(--kart-kenar);
    font: 500 22px/1 var(--sans); color: var(--soluk);
  }
  .nokta { width: 16px; height: 16px; border-radius: 50%; }
  .terminal-bas span { margin-left: 10px; }
  .terminal-govde { padding: 28px 34px 30px; font-family: var(--mono); }
  .komut { font-size: 20px; line-height: 1.6; color: #c9d1e0; white-space: pre-wrap; word-break: break-all; }
  .komut .p { color: var(--vurgu); }
  .komut .yorum { color: var(--cok-soluk); }
  .cikti { margin-top: 22px; display: flex; flex-direction: column; gap: 9px; align-items: flex-start; }
  .cikti span {
    font: 700 28px/1 var(--mono); color: var(--vurgu-koyu); background: var(--vurgu);
    padding: 8px 12px; border-radius: 6px;
  }

  .kart { background: var(--kart); border: 1px solid var(--kart-kenar); border-radius: 28px; padding: 30px 36px; }
  .kart h2 {
    font: 700 22px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase;
    color: var(--cok-soluk); margin-bottom: 22px;
  }
  .kart p { font: 400 31px/1.42 var(--sans); color: var(--soluk); }
  .kart code { font: 500 27px var(--mono); color: var(--mavi); }

  .ciplar { display: flex; flex-wrap: wrap; gap: 12px; }
  .cip {
    font: 600 26px/1 var(--mono); padding: 14px 18px; border-radius: 14px;
    background: #1b2030; color: var(--metin); border: 1px solid #2b3246;
  }
  .cip--vurgu {
    background: color-mix(in srgb, var(--vurgu) 14%, transparent);
    border-color: color-mix(in srgb, var(--vurgu) 55%, transparent); color: var(--vurgu);
  }

  .rakamlar { display: grid; grid-template-columns: repeat(var(--sutun), 1fr); gap: 16px; }
  .rakam { background: #1b2030; border: 1px solid #2b3246; border-radius: 20px; padding: 24px 22px; }
  .rakam strong { display: block; font: 800 54px/1 var(--sans); letter-spacing: -.02em; color: var(--vurgu); }
  .rakam span { display: block; margin-top: 12px; font: 500 24px/1.3 var(--sans); color: var(--soluk); }

  .liste { list-style: none; display: flex; flex-direction: column; gap: 16px; }
  .liste li { position: relative; padding-left: 44px; font: 400 31px/1.38 var(--sans); color: var(--soluk); }
  .liste li::before {
    content: ""; position: absolute; left: 4px; top: 14px; width: 16px; height: 16px;
    border-radius: 5px; background: var(--vurgu);
  }

  .alinti p { font: 500 36px/1.36 var(--sans); color: var(--metin); }
  .alinti p::before { content: "“"; color: var(--vurgu); font-weight: 800; margin-right: 4px; }
  .alinti p::after { content: "”"; color: var(--vurgu); font-weight: 800; margin-left: 2px; }
  .alinti cite { display: block; margin-top: 18px; font: 600 24px/1.3 var(--sans); font-style: normal; color: var(--cok-soluk); }

  .gorsel { padding: 16px; }
  .gorsel img { display: block; width: 100%; max-height: 640px; object-fit: contain; border-radius: 16px; background: #07080c; }
  .gorsel figcaption { margin: 16px 8px 4px; font: 500 24px/1.35 var(--sans); color: var(--cok-soluk); }

  .alt-bilgi {
    margin-top: auto; padding-top: 32px;
    display: flex; flex-direction: column; gap: 10px;
    font: 500 22px/1.4 var(--sans); color: var(--cok-soluk);
  }
  .alt-bilgi code { font: 500 21px var(--mono); color: var(--soluk); }
</style>
</head>
<body>
<div class="sayfa">
  <div class="icerik">
{{ICERIK}}
  </div>
{{ALT_BILGI}}
</div>
<script>
window.addEventListener('load', function () {
  var sayfa = document.querySelector('.sayfa');
  var icerik = document.querySelector('.icerik');
  var alt = document.querySelector('.alt-bilgi');
  var stil = getComputedStyle(sayfa);
  var bos = 1920 - parseFloat(stil.paddingTop) - parseFloat(stil.paddingBottom) - (alt ? alt.offsetHeight : 0);
  var olcek = 1;
  for (var i = 0; i < 8; i++) {
    var h = icerik.getBoundingClientRect().height;
    if (h <= bos + 1) { break; }
    olcek = olcek * (bos / h) * 0.995;
    icerik.style.zoom = olcek;
  }
  var tasti = icerik.getBoundingClientRect().height > bos + 1;
  document.body.dataset.olcek = olcek.toFixed(3);
  document.body.dataset.tasma = (tasti || olcek < 0.8) ? 'evet' : 'hayir';
});
</script>
</body>
</html>
